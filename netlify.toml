[build]
  command = "npm run build"
  publish = "dist"

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"

# ADD THIS SECTION BELOW
[dev]
  framework = "vite"
  targetPort = 5173  # This is the default Vite port
  port = 3000        # This is the port you will actually visit in your browser

[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"